<!DOCTYPE html>
<html lang="ja">
<head>
  <base target="_top">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>甲子園2026夏</title>
<meta name="theme-color" content="#0a0d10">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="甲子園2026夏">
  <style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { height: 100%; }
  body { min-height: 100%; } /* height:100%だと下余白が画面高基準になり、はみ出した最終行が固定タブに隠れる */
  body {
    background:
      radial-gradient(1100px 520px at 50% -12%, rgba(253, 224, 71, .10), transparent 62%),
      radial-gradient(720px 400px at 88% 6%, rgba(96, 165, 250, .06), transparent 70%),
      radial-gradient(600px 360px at 8% 14%, rgba(248, 113, 113, .05), transparent 70%),
      linear-gradient(180deg, #171d24 0%, #0b0e11 36%, #06080a 100%);
    background-attachment: fixed;
    color: #e8ecf1;
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic UI", "Meiryo", sans-serif;
    line-height: 1.6;
    padding-bottom: calc(124px + env(safe-area-inset-bottom)); /* 固定タブに最後のカードが隠れない余白 */
  }
  button { font-family: inherit; cursor: pointer; }

  /* ── ヘッダー（スコアボード風） ── */
  .app-head {
    position: sticky; top: 0; z-index: 50;
    background: linear-gradient(180deg, #161b21, #0a0d10);
    border-bottom: 2px solid #fde047;
    box-shadow: 0 4px 18px rgba(253, 224, 71, .12);
    padding: 11px 14px 9px;
  }
  .head-row { display: flex; align-items: center; justify-content: space-between; max-width: 720px; margin: 0 auto; }
  .app-head h1 {
    font-size: 1.3rem; font-weight: 900; letter-spacing: .14em; color: #fff;
    text-shadow: 0 0 16px rgba(255, 255, 255, .18);
  }
  .head-year { color: #fde047; margin-left: 6px; letter-spacing: .06em; text-shadow: 0 0 18px rgba(253, 224, 71, .55); }
  .head-natsu { color: #f87171; margin-left: 4px; text-shadow: 0 0 14px rgba(248, 113, 113, .5); }
  .refresh-btn {
    background: #1c232a; border: 1px solid #333d47; color: #e8ecf1;
    border-radius: 10px; font-size: 1rem; padding: 6px 12px;
  }
  .refresh-btn.spin { animation: spin 1s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .data-status {
    display: none; max-width: 720px; margin: 4px auto 0;
    font-size: .74rem; color: #9aa7b4;
  }

  main { max-width: 720px; margin: 0 auto; padding: 14px 12px; }

  /* タブ切替時のふわっと表示 */
  .tab-page { animation: fadeUp .3s ease; }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }

  /* ── 共通パネル ── */
  .panel {
    background: linear-gradient(170deg, #141a21, #0e1318);
    border: 1px solid #26303b; border-radius: 16px;
    box-shadow: 0 8px 26px rgba(0, 0, 0, .38);
    padding: 16px 14px; margin-bottom: 14px;
  }
  .panel-title { font-size: 1.05rem; font-weight: 800; margin-bottom: 8px; display: flex; align-items: center; gap: 8px; }
  .panel-title::before {
    content: ''; width: 5px; height: 18px; border-radius: 3px; flex: none;
    background: linear-gradient(180deg, #fde047, #f59e0b);
    box-shadow: 0 0 10px rgba(253, 224, 71, .5);
  }
  .panel-note { font-size: .88rem; color: #9aa7b4; }
  .panel-note strong { color: #fde047; }
  .rem-count { font-size: .78rem; color: #fde047; font-weight: 700; margin-left: auto; }

  /* ── くじ引き ── */
  .draw-label { text-align: center; font-size: .9rem; color: #c7d0d9; margin: 14px 0 10px; }
  .player-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .player-btn {
    background: linear-gradient(160deg, #1d2733, #131a22);
    border: 1px solid #2c3742; border-left: 5px solid var(--mc, #3b82f6);
    color: #fff; border-radius: 13px; padding: 15px 8px;
    font-size: 1.08rem; font-weight: 800;
    display: flex; flex-direction: column; align-items: center; gap: 2px;
    box-shadow: 0 4px 14px rgba(0, 0, 0, .3);
    transition: transform .1s ease, box-shadow .2s ease;
  }
  .player-btn:not(.drawn):active { transform: scale(.95); box-shadow: 0 0 18px rgba(253, 224, 71, .25); }
  .player-btn .btn-status { font-size: .72rem; color: #8bd48b; font-weight: 600; }
  .player-btn.drawn { opacity: .45; cursor: default; }
  .confirm-box { text-align: center; padding: 10px 0 4px; }
  .confirm-who { font-size: 1.5rem; font-weight: 900; color: #fde047; text-shadow: 0 0 16px rgba(253, 224, 71, .45); }
  .confirm-note { font-size: .85rem; color: #9aa7b4; margin: 6px 0 12px; }
  .confirm-btns { display: flex; gap: 10px; justify-content: center; }
  .btn-main {
    background: linear-gradient(180deg, #fde047, #eab308); color: #1c1c05;
    border: none; border-radius: 12px; font-size: 1.02rem; font-weight: 900;
    padding: 12px 26px; box-shadow: 0 4px 18px rgba(234, 179, 8, .45);
  }
  .btn-main:active { transform: scale(.97); }
  .btn-sub {
    background: #1a222b; border: 1px solid #2c3742; color: #c7d0d9;
    border-radius: 12px; font-size: .95rem; padding: 12px 20px;
  }
  .loading-msg { text-align: center; color: #fde047; font-weight: 700; padding: 12px 0; animation: pulseText 1s ease-in-out infinite; }
  @keyframes pulseText { 50% { opacity: .45; } }
  .error-msg {
    background: #2a1215; border: 1px solid #7f1d1d; color: #fca5a5;
    border-radius: 10px; padding: 10px 12px; font-size: .86rem; margin-top: 12px;
  }

  /* ── ガチャモーダル ── */
  .gacha-modal {
    display: none; position: fixed; inset: 0; z-index: 100;
    background: radial-gradient(900px 500px at 50% 0%, rgba(253, 224, 71, .08), transparent 60%), rgba(3, 5, 8, .97);
    overflow-y: auto;
  }
  .gacha-modal.open { display: block; }
  .gacha-inner { max-width: 560px; margin: 0 auto; padding: 22px 14px 64px; }
  .gacha-header { text-align: center; font-size: 1.2rem; font-weight: 900; margin-bottom: 4px; text-shadow: 0 0 14px rgba(255,255,255,.2); }
  .gacha-hint { text-align: center; font-size: .8rem; color: #9aa7b4; min-height: 1.3em; margin-bottom: 14px; }
  .gacha-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }

  .gcard { position: relative; aspect-ratio: 3 / 4; border-radius: 12px; perspective: 700px; opacity: .55; }
  .gcard.next, .gcard.flipped { opacity: 1; }
  .gcard-in {
    position: absolute; inset: 0; transform-style: preserve-3d;
    transition: transform .55s cubic-bezier(.2, .7, .3, 1.1);
  }
  .gcard.flipped .gcard-in { transform: rotateY(180deg); }
  .gcard.flipped { animation: pop .5s cubic-bezier(.2, .8, .3, 1.35); }
  .gcard.flipped.rar-ssr { animation: popBig .7s cubic-bezier(.2, .8, .3, 1.35); }
  @keyframes pop { 45% { transform: scale(1.1); } 100% { transform: scale(1); } }
  @keyframes popBig { 40% { transform: scale(1.22) rotate(-2deg); } 70% { transform: scale(.97); } 100% { transform: scale(1); } }
  .gface {
    position: absolute; inset: 0; backface-visibility: hidden;
    border-radius: 12px; display: flex; flex-direction: column;
    align-items: center; justify-content: center; text-align: center; padding: 6px;
  }
  .gface-back {
    background: linear-gradient(160deg, #1d2732, #10161c);
    border: 1px solid #33404d; font-size: 1.8rem; color: #5c6b7a;
  }
  .gcard.next .gface-back {
    border-color: #fde047; color: #fde047;
    box-shadow: 0 0 14px rgba(253, 224, 71, .35);
    animation: beckon 1.2s ease-in-out infinite;
  }
  @keyframes beckon { 50% { transform: translateY(-3px); } }
  .gcard.charging .gface-back {
    border: 2px solid #fde047; color: #fff;
    animation: charge .16s linear infinite;
    box-shadow: 0 0 28px rgba(253, 224, 71, .95), 0 0 70px rgba(253, 224, 71, .55);
  }
  @keyframes charge {
    0% { transform: translate(-2px, 1px); } 25% { transform: translate(2px, -1px); }
    50% { transform: translate(-1px, -2px); } 75% { transform: translate(1px, 2px); }
    100% { transform: translate(-2px, 1px); }
  }
  .gface-front { transform: rotateY(180deg); border: 1px solid #33404d; background: #171e26; }
  .gface-front .gc-name { font-size: .88rem; font-weight: 800; line-height: 1.25; }
  .gface-front .gc-pref { font-size: .68rem; color: #9aa7b4; margin-top: 2px; }
  .gface-front .rb { margin-bottom: 5px; }

  .gcard.rar-ssr .gface-front {
    border: 2px solid #fde047;
    background:
      radial-gradient(120px 90px at 50% 0%, rgba(253, 224, 71, .28), transparent 70%),
      linear-gradient(160deg, #2f2810, #171307);
    box-shadow: 0 0 22px rgba(253, 224, 71, .65), 0 0 60px rgba(253, 224, 71, .25);
  }
  .gcard.rar-sr .gface-front {
    border: 2px solid #c084fc;
    background:
      radial-gradient(120px 90px at 50% 0%, rgba(192, 132, 252, .24), transparent 70%),
      linear-gradient(160deg, #271c38, #130d1c);
    box-shadow: 0 0 16px rgba(192, 132, 252, .55);
  }
  .gcard.rar-r .gface-front {
    border: 1px solid #60a5fa;
    background: linear-gradient(160deg, #17263a, #0e141d);
    box-shadow: 0 0 12px rgba(96, 165, 250, .35);
  }

  .gacha-close { display: block; margin: 22px auto 0; }
  .carry-notice {
    margin-top: 18px; background: #12161b; border: 1px dashed #3a4652;
    border-radius: 12px; padding: 12px; animation: fadeUp .5s ease;
  }
  .carry-title { font-weight: 800; font-size: .9rem; margin-bottom: 6px; }
  .carry-chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .carry-note { font-size: .74rem; color: #9aa7b4; margin-top: 6px; }

  /* 演出パーツ：スプラッシュ文字とパーティクル */
  .splash {
    position: fixed; top: 38%; left: 50%; z-index: 10000; pointer-events: none;
    font-weight: 900; letter-spacing: .1em; text-align: center; white-space: nowrap;
    animation: splashPop 1.15s ease forwards;
  }
  .splash-ssr { font-size: 3.4rem; color: #fde047; text-shadow: 0 0 24px rgba(253, 224, 71, .95), 0 0 70px rgba(253, 224, 71, .55); }
  .splash-sr  { font-size: 2.4rem; color: #d8b4fe; text-shadow: 0 0 20px rgba(192, 132, 252, .9), 0 0 50px rgba(192, 132, 252, .45); }
  @keyframes splashPop {
    0%   { opacity: 0; transform: translate(-50%, -50%) scale(.25); }
    22%  { opacity: 1; transform: translate(-50%, -50%) scale(1.2); }
    42%  { transform: translate(-50%, -50%) scale(1); }
    75%  { opacity: 1; }
    100% { opacity: 0; transform: translate(-50%, -64%) scale(1); }
  }
  .pt {
    position: fixed; width: 9px; height: 9px; border-radius: 50%;
    pointer-events: none; z-index: 9999; opacity: 1;
    transition: transform .8s cubic-bezier(.1, .6, .3, 1), opacity .8s ease;
    box-shadow: 0 0 8px currentColor;
  }

  /* ── レア度バッジ ── */
  .rb {
    display: inline-block; font-size: .62rem; font-weight: 900;
    border-radius: 6px; padding: 1px 7px; letter-spacing: .05em;
  }
  .rb-ssr { background: linear-gradient(90deg, #fde047, #f59e0b); color: #201a02; box-shadow: 0 0 8px rgba(253, 224, 71, .5); }
  .rb-sr  { background: linear-gradient(90deg, #c084fc, #9333ea); color: #fff; box-shadow: 0 0 7px rgba(192, 132, 252, .4); }
  .rb-r   { background: linear-gradient(90deg, #60a5fa, #2563eb); color: #fff; }
  .rb-n   { background: #2b333c; color: #93a1af; }

  /* ── 凡例 ── */
  .legend { display: flex; flex-wrap: wrap; gap: 8px 12px; margin-bottom: 12px; }
  .legend-item { display: flex; align-items: center; gap: 5px; font-size: .78rem; color: #c7d0d9; }
  .legend-dot { width: 10px; height: 10px; border-radius: 3px; flex: none; box-shadow: 0 0 6px currentColor; }

  /* ── ブラケット（3回戦までの山） ── */
  .bk-scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; margin: 0 -12px; padding: 0 12px; }
  .bk-tree { position: relative; display: flex; gap: 34px; width: max-content; padding: 6px 8px 18px; }
  .bk-svg { position: absolute; inset: 0; pointer-events: none; z-index: 0; }
  .bk-col { display: flex; flex-direction: column; gap: 6px; z-index: 1; width: 168px; }
  /* タイトルは上に固定し、カード部だけを縦いっぱいに分散させる */
  .bk-col-body { flex: 1; display: flex; flex-direction: column; justify-content: space-around; gap: 10px; }
  .bk-col-title {
    text-align: center; font-size: .78rem; font-weight: 800; color: #fde047;
    letter-spacing: .1em; margin-bottom: 2px; text-shadow: 0 0 10px rgba(253, 224, 71, .4);
  }

  .match {
    background: linear-gradient(170deg, #141a21, #0f1419);
    border: 1px solid #26303b; border-radius: 10px;
    overflow: hidden; font-size: .8rem;
    box-shadow: 0 3px 10px rgba(0, 0, 0, .3);
  }
  .match-meta { font-size: .62rem; color: #7b8894; padding: 3px 8px 0; }
  .mrow { display: flex; align-items: center; gap: 6px; padding: 4px 8px; }
  .mrow + .mrow { border-top: 1px solid #1c232a; }
  .mrow .obar { width: 4px; align-self: stretch; border-radius: 2px; flex: none; }
  .mrow .mname { flex: 1; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .mrow .mpref { font-size: .62rem; color: #7b8894; flex: none; }
  .mrow .mscore { font-weight: 900; font-size: .92rem; width: 1.6em; text-align: right; flex: none; }
  .mrow.loser .mname, .mrow.loser .mscore { color: #5c6b7a; }
  .mrow.winner { background: linear-gradient(90deg, rgba(253, 224, 71, .07), transparent); }
  .mrow.winner .mscore { color: #fde047; text-shadow: 0 0 8px rgba(253, 224, 71, .5); }
  .mrow.tbd .mname { color: #5c6b7a; font-weight: 500; font-size: .72rem; }

  /* ── 終盤（準々決勝以降のカード） ── */
  /* 中央カラム（準々決勝→準決勝→決勝の縦積み・両側の山の間） */
  .bk-center {
    display: flex; flex-direction: column; justify-content: center; gap: 22px;
    width: 176px; z-index: 1; padding: 0 6px;
  }
  .bk-center-sec { display: flex; flex-direction: column; gap: 8px; }
  .bk-center-sec.final .match { border-color: rgba(253, 224, 71, .45); }
  .bk-center .finals-wait { text-align: center; }

  .finals-sec { margin-top: 18px; }
  .finals-title {
    font-size: .9rem; font-weight: 800; color: #fde047; letter-spacing: .08em;
    margin-bottom: 8px; text-shadow: 0 0 10px rgba(253, 224, 71, .4);
  }
  .finals-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .finals-grid.single { grid-template-columns: 1fr; max-width: 340px; }
  .finals-wait { font-size: .78rem; color: #7b8894; background: #10141a; border: 1px dashed #2c3742; border-radius: 10px; padding: 10px 12px; }

  /* ── 持ち校一覧 ── */
  .champ-banner {
    position: relative; overflow: hidden;
    background:
      radial-gradient(300px 120px at 50% 0%, rgba(253, 224, 71, .22), transparent 70%),
      linear-gradient(160deg, #2f2810, #171307);
    border: 2px solid #fde047;
    border-radius: 14px; padding: 15px; text-align: center; margin-bottom: 14px;
    font-weight: 900; font-size: 1.1rem;
    box-shadow: 0 0 26px rgba(253, 224, 71, .3);
  }
  .champ-banner::after {
    content: ''; position: absolute; top: 0; left: -60%; width: 40%; height: 100%;
    background: linear-gradient(100deg, transparent, rgba(255, 255, 255, .2), transparent);
    animation: shine 2.6s ease-in-out infinite;
  }
  @keyframes shine { 0% { left: -60%; } 60% { left: 120%; } 100% { left: 120%; } }
  .champ-banner .champ-sub { display: block; font-size: .8rem; color: #d9c464; font-weight: 700; margin-top: 2px; }

  .mine-card {
    background: linear-gradient(170deg, #141a21, #0e1318);
    border: 1px solid #26303b; border-radius: 14px;
    padding: 12px 12px 12px; margin-bottom: 12px;
    box-shadow: 0 4px 14px rgba(0, 0, 0, .3);
  }
  .mine-card.me { border-color: #fde047; box-shadow: 0 0 18px rgba(253, 224, 71, .18); }
  .mine-head { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; flex-wrap: wrap; }
  .mine-dot { width: 12px; height: 12px; border-radius: 4px; flex: none; box-shadow: 0 0 8px currentColor; }
  .mine-name { font-weight: 900; font-size: 1.02rem; }
  .mine-me-badge { font-size: .62rem; background: #fde047; color: #201a02; font-weight: 900; border-radius: 6px; padding: 1px 6px; }
  .mine-alive { margin-left: auto; font-size: .78rem; color: #9aa7b4; }
  .mine-alive strong { color: #fde047; font-size: .98rem; text-shadow: 0 0 8px rgba(253, 224, 71, .4); }
  .alive-bar { height: 6px; background: #1b232c; border-radius: 4px; overflow: hidden; margin-bottom: 9px; }
  .alive-fill { height: 100%; border-radius: 4px; transition: width .6s ease; box-shadow: 0 0 8px currentColor; }
  .school-chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .schip {
    display: inline-flex; align-items: center; gap: 5px;
    background: #1a222b; border: 1px solid #2c3742; border-radius: 8px;
    padding: 3px 8px; font-size: .78rem; font-weight: 700;
  }
  .schip .schip-pref { font-size: .62rem; color: #7b8894; font-weight: 500; }
  .schip.out { opacity: .4; }
  .schip.out .schip-name { text-decoration: line-through; }
  .mine-empty { font-size: .8rem; color: #7b8894; }

  /* ── 下タブ ── */
  .tab-bar {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 60;
    display: flex; background: rgba(10, 13, 17, .96);
    backdrop-filter: blur(8px);
    border-top: 1px solid #232b33;
    padding-bottom: env(safe-area-inset-bottom);
  }
  .tab-btn {
    position: relative; flex: 1; background: none; border: none; color: #7b8894;
    font-size: .72rem; font-weight: 700; padding: 9px 0 10px;
    display: flex; flex-direction: column; align-items: center; gap: 1px;
    transition: color .15s ease;
  }
  .tab-btn .tab-ico { font-size: 1.2rem; }
  .tab-btn.active { color: #fde047; }
  .tab-btn.active::before {
    content: ''; position: absolute; top: 0; left: 50%; transform: translateX(-50%);
    width: 30px; height: 3px; border-radius: 2px;
    background: #fde047; box-shadow: 0 0 10px rgba(253, 224, 71, .7);
  }
</style>

</head>
<body>

  <header class="app-head">
    <div class="head-row">
      <h1>甲子園<span class="head-year">2026</span><span class="head-natsu">夏</span></h1>
      <button id="refreshBtn" class="refresh-btn" onclick="onRefresh()" title="最新に更新">🔄</button>
    </div>
    <div id="data-status" class="data-status"></div>
  </header>

  <main id="content">

    <!-- くじ引きタブ -->
    <section id="tab-draw" class="tab-page">
      <div class="panel">
        <div class="panel-title">🎟️ 学校くじ引き</div>
        <p class="panel-note">49代表校から<strong>9校</strong>を引きます。引き直しはできません。<br>残り <span id="remainingNum">--</span> 校</p>
        <div id="drawCardLabel" class="draw-label">名前をタップしてください</div>
        <div id="playerBtns" class="player-grid"></div>
        <div id="confirmSection" class="confirm-box" style="display:none;">
          <div id="confirmWho" class="confirm-who"></div>
          <p class="confirm-note">この名前でくじを引きます。よろしいですか？</p>
          <div class="confirm-btns">
            <button class="btn-sub" onclick="onCancelDraw()">やめる</button>
            <button class="btn-main" onclick="onConfirmDraw()">くじを引く！</button>
          </div>
        </div>
        <div id="loadingMsg" class="loading-msg" style="display:none;">⚾ 抽選中…</div>
        <div id="errorMsg" class="error-msg" style="display:none;"></div>
      </div>
      <div class="panel">
        <div class="panel-title">🏫 残りの学校<span id="remCount" class="rem-count"></span></div>
        <div id="remainingList" class="school-chips"></div>
      </div>
    </section>

    <!-- トーナメントタブ -->
    <section id="tab-bracket" class="tab-page" style="display:none;">
      <div id="bkLegend" class="legend"></div>
      <div id="bkEmpty" class="panel panel-note" style="display:none;">組み合わせ抽選（例年8月頭）のあとに表示されます</div>
      <div id="bkScroll" class="bk-scroll">
        <div id="bkTree" class="bk-tree">
          <svg id="bkSvg" class="bk-svg"></svg>
        </div>
      </div>
    </section>

  <script>
// メンバーと色（ブラケット・持ち校一覧の色分けに使う）
var MEMBERS = ['あさひ', 'しょーじ', 'たくと', 'ひろかず', 'なおと'];
var CARRY = 'キャリー';
var OWNER_COLORS = {

  'ひろかず': '#f59e0b',

var RARITY_ORDER = { 'SSR': 0, 'SR': 1, 'R': 2, 'N': 3 };

function rarityBadge(r) {
  if (r === 'SSR') return '<span class="rb rb-ssr">★SSR</span>';
  if (r === 'SR')  return '<span class="rb rb-sr">★SR</span>';

  <script>
// ────────────────────────────────────────────────
// API呼び出し共通ヘルパー（1ソース2環境）
//   GAS版（身内URL直アクセス）: google.script.run を使う
//   PWA版（GitHub Pages）     : fetch → GASのJSON API を使う
// GAS_API_URL はビルド.ps1 が実URLに置換する。空のままならGAS版として動く。
// ────────────────────────────────────────────────
var GAS_API_URL = 'https://script.google.com/macros/s/AKfycbxOxbTP3q8yFZFWRCvnvXxlmtOKZv7GAAQLNgvh--JuE-K7ISsRrAcULN5ZRs1pNVHshw/exec';

function apiCall(action, params, onSuccess, onFailure) {
  if (!GAS_API_URL) {
    var runner = google.script.run
      .withSuccessHandler(onSuccess)
      .withFailureHandler(onFailure);
    if (action === 'state') runner.getState();
    else if (action === 'draw') runner.drawSchools(params.player);
    else onFailure(new Error('不明なaction: ' + action));
    return;
  }
  var qs = 'action=' + encodeURIComponent(action);
  if (params) {
    for (var k in params) qs += '&' + k + '=' + encodeURIComponent(params[k]);
  }
  fetch(GAS_API_URL + '?' + qs)
    .then(function(r) {
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return r.json();
    })
    .then(function(d) {
      if (d && d.__error) throw new Error(d.__error);
      onSuccess(d);
    })
    .catch(function(e) { onFailure(e); });
}

// 前回データのキャッシュ（localStorage）。起動時に即表示し、裏で最新に差し替える
function saveCache(name, data) {
  try {
    localStorage.setItem('koshien2026_cache_' + name, JSON.stringify({ t: Date.now(), d: data }));
  } catch (e) {}
}

function loadCache(name) {
  try {
    var raw = localStorage.getItem('koshien2026_cache_' + name);
    return raw ? JSON.parse(raw) : null;
  } catch (e) { return null; }
}

function fmtCacheTime(t) {
  var d = new Date(t);
  return (d.getMonth() + 1) + '/' + d.getDate() + ' ' + d.getHours() + ':' + ('0' + d.getMinutes()).slice(-2);
}

// ヘッダー下の小さいステータス表示（オフライン時など）。空文字で非表示
function setDataStatus(text) {
  var el = document.getElementById('data-status');
  if (!el) return;
  el.textContent = text || '';
  el.style.display = text ? 'block' : 'none';
}
</script>

  <script>
// ────────────────────────────────────────────────
// くじ引きタブ：名前選択 → 確認 → 抽選 → 連続自動でめくれる演出
// レア度別演出：R=青フラッシュ＋粒 / SR=紫溜め＋スプラッシュ / SSR=金溜め＋大スプラッシュ
// ────────────────────────────────────────────────
var pendingName = '';
var gachaTeams = [];
var gachaCarried = [];

function renderDraw() {
  var st = APP.state;
  if (!st) return;
  document.getElementById('remainingNum').textContent = st.remaining;
  renderPlayerButtons();
  renderRemaining();
}

function renderPlayerButtons() {
  var st = APP.state;
  document.getElementById('playerBtns').style.display = 'grid';
  document.getElementById('confirmSection').style.display = 'none';
  document.getElementById('drawCardLabel').textContent = '名前をタップしてください';
  pendingName = '';

  var grid = document.getElementById('playerBtns');
  grid.innerHTML = MEMBERS.map(function(name) {
    var drew = st && st.drawn && st.drawn[name];
    var style = ' style="--mc:' + ownerColor(name) + '"';
    if (drew) {
      return '<button class="player-btn drawn"' + style + ' disabled>'
        + '<span class="btn-name">' + h(name) + '</span>'
        + '<span class="btn-status">引き済み ✓</span>'
        + '</button>';
    }
    return '<button class="player-btn"' + style + ' onclick="onPlayerClick(' + h(JSON.stringify(name)) + ')">'
      + '<span class="btn-name">' + h(name) + '</span>'
      + '</button>';
  }).join('');
}

// 残りの学校一覧（シート順＝北から順。レア度も公開）
function renderRemaining() {
  var st = APP.state;
  var list = document.getElementById('remainingList');
  var remaining = st.teams.filter(function(t) { return !t.owner; });
  document.getElementById('remCount').textContent = 'あと' + remaining.length + '校';
  if (!remaining.length) {
    list.innerHTML = '<span class="mine-empty">全校の引き先が決まりました！</span>';
    return;
  }
  list.innerHTML = remaining.map(function(t) {
    return '<span class="schip">' + rarityBadge(t.rarity)
      + '<span class="schip-name">' + h(t.name) + '</span>'
      + '<span class="schip-pref">' + h(t.pref) + '</span></span>';
  }).join('');
}

function onPlayerClick(name) {
  pendingName = name;
  document.getElementById('playerBtns').style.display = 'none';
  document.getElementById('drawCardLabel').textContent = '';
  document.getElementById('confirmWho').textContent = name;
  document.getElementById('confirmSection').style.display = 'block';
  hideError();
}

function onCancelDraw() {
  renderPlayerButtons();
  hideError();
}

function onConfirmDraw() {
  if (!pendingName) return;
  var name = pendingName;
  pendingName = '';
  document.getElementById('confirmSection').style.display = 'none';
  setLoading(true);
  hideError();
  apiCall('draw', { player: name }, function(r) {
    setLoading(false);
    handleDrawResult(name, r);
  }, function() {
    setLoading(false);
    renderPlayerButtons();
    showError('通信エラーが発生しました。もう一度試してください。');
  });
}

function handleDrawResult(name, r) {
  if (r.alreadyDrew) {
    showError(r.message);
    renderPlayerButtons();
    refreshState();
    return;
  }
  if (!r.ok) {
    showError(r.message || 'エラーが発生しました');
    renderPlayerButtons();
    refreshState();
    return;
  }
  hideError();
  try { localStorage.setItem('koshien2026_me', name); } catch (e) {}
  openGacha(r.player, r.teams, r.carried || []);
  refreshState();
}

// ── ガチャ演出（連続自動公開） ──────────────────
function openGacha(name, teams, carried) {
  gachaTeams = teams;
  gachaCarried = carried;
  window.scrollTo(0, 0);

  document.getElementById('gachaHeader').textContent = name + 'の9校';
  document.getElementById('gachaHint').textContent = '結果発表…！';
  document.getElementById('gachaCarry').innerHTML = '';
  document.getElementById('gachaCloseBtn').style.display = 'none';

  var grid = document.getElementById('gachaGrid');
  grid.innerHTML = teams.map(function(_, i) {
    return '<div class="gcard" id="gcard-' + i + '">'
      + '<div class="gcard-in">'
      + '<div class="gface gface-back">⚾</div>'
      + '<div class="gface gface-front"></div>'
      + '</div></div>';
  }).join('');
  document.getElementById('gachaModal').classList.add('open');

  // タイムライン組み立て：レア度が高いカードほど「溜め」を長く、直後に間を置く
  var t = 900;
  teams.forEach(function(tm, i) {
    var lead = tm.rarity === 'SSR' ? 1600 : (tm.rarity === 'SR' ? 1100 : 350);
    (function(idx, rar, revealAt) {
      setTimeout(function() { prepCard(idx, rar); }, Math.max(250, revealAt - lead));
      setTimeout(function() { revealCard(idx); }, revealAt);
    })(i, tm.rarity, t);
    var gap = 1000 + i * 110;
    if (tm.rarity === 'SSR') gap += 1000;
    else if (tm.rarity === 'SR') gap += 500;
    t += gap;
  });
  setTimeout(finishGacha, t + 300);
}

// めくる直前の予兆：SSR/SR=金の激しい溜め（開くまでどちらかは分からない）/ それ以外=黄色く光る
function prepCard(i, rarity) {
  var card = document.getElementById('gcard-' + i);
  if (!card) return;
  if (rarity === 'SSR' || rarity === 'SR') {
    card.classList.add('charging');
    if (navigator.vibrate) navigator.vibrate([60, 40, 60, 40, 60]);
  } else {
    card.classList.add('next');
  }
}

function revealCard(i) {
  var t = gachaTeams[i];
  var card = document.getElementById('gcard-' + i);
  if (!card) return;
  card.classList.remove('next', 'charging');

  var front = card.querySelector('.gface-front');
  front.innerHTML = rarityBadge(t.rarity)
    + '<div class="gc-name">' + h(t.name) + '</div>'
    + '<div class="gc-pref">' + h(t.pref) + '</div>';
  card.classList.add('flipped', 'rar-' + String(t.rarity).toLowerCase());

  if (t.rarity === 'SSR') {
    colorFlash('rgba(253,224,71,0.65)', 750);
    setTimeout(function() { colorFlash('rgba(253,224,71,0.35)', 500); }, 220);
    burst(card, ['#fde047', '#f59e0b', '#fff7cc'], 26);
    splashText('★ SSR ★', 'splash-ssr');
    if (navigator.vibrate) navigator.vibrate([120, 60, 260, 60, 500]);
  } else if (t.rarity === 'SR') {
    colorFlash('rgba(192,132,252,0.5)', 650);
    burst(card, ['#c084fc', '#a855f7', '#f0e1ff'], 16);
    splashText('SR!!', 'splash-sr');
    if (navigator.vibrate) navigator.vibrate([90, 50, 200]);
  } else if (t.rarity === 'R') {
    colorFlash('rgba(96,165,250,0.4)', 500);
    burst(card, ['#60a5fa', '#93c5fd'], 10);
    if (navigator.vibrate) navigator.vibrate(45);
  }
}

function finishGacha() {
  document.getElementById('gachaHint').textContent = '';
  if (gachaCarried.length > 0) {
    var chips = gachaCarried.map(function(t) {
      return '<span class="schip">' + rarityBadge(t.rarity) + '<span class="schip-name">' + h(t.name) + '</span>'
        + '<span class="schip-pref">' + h(t.pref) + '</span></span>';
    }).join('');
    document.getElementById('gachaCarry').innerHTML =
      '<div class="carry-notice">'
      + '<div class="carry-title">🏳️ キャリー（引き手なし）の' + gachaCarried.length + '校</div>'
      + '<div class="carry-chips">' + chips + '</div>'
      + '<div class="carry-note">キャリー校が優勝した場合は全員負けです</div>'
      + '</div>';
  }
  document.getElementById('gachaCloseBtn').style.display = 'block';
}

// ── 演出ヘルパー ──────────────────────────────
function colorFlash(rgba, dur) {
  var el = document.createElement('div');
  el.style.cssText = 'position:fixed;inset:0;background:' + rgba + ';pointer-events:none;z-index:9998;opacity:1;transition:opacity ' + (dur / 1000) + 's ease;';
  document.body.appendChild(el);
  setTimeout(function() { el.style.opacity = '0'; }, 60);
  setTimeout(function() { el.remove(); }, dur + 120);
}

function burst(cardEl, colors, n) {
  var r = cardEl.getBoundingClientRect();
  var cx = r.left + r.width / 2;
  var cy = r.top + r.height / 2;
  for (var i = 0; i < n; i++) {
    var p = document.createElement('div');
    p.className = 'pt';
    var c = colors[i % colors.length];
    p.style.background = c;
    p.style.color = c;
    p.style.left = cx + 'px';
    p.style.top = cy + 'px';
    document.body.appendChild(p);
    var ang = Math.random() * Math.PI * 2;
    var dist = 60 + Math.random() * 110;
    (function(el, dx, dy) {
      requestAnimationFrame(function() {
        requestAnimationFrame(function() {
          el.style.transform = 'translate(' + dx + 'px,' + dy + 'px) scale(.15)';
          el.style.opacity = '0';
        });
      });
      setTimeout(function() { el.remove(); }, 900);
    })(p, Math.cos(ang) * dist, Math.sin(ang) * dist);
  }
}

function splashText(text, cls) {
  var el = document.createElement('div');
  el.className = 'splash ' + cls;
  el.textContent = text;
  document.body.appendChild(el);
  setTimeout(function() { el.remove(); }, 1200);
}

function closeGacha() {
  document.getElementById('gachaModal').classList.remove('open');
  showTab('mine');
}

function setLoading(on) {
  document.getElementById('loadingMsg').style.display = on ? 'block' : 'none';
}
function showError(msg) {
  var el = document.getElementById('errorMsg');
  el.textContent = msg; el.style.display = 'block';
}
function hideError() { document.getElementById('errorMsg').style.display = 'none'; }
</script>

  <script>
// ────────────────────────────────────────────────
// トーナメントタブ（両側収束レイアウト・2026-08-07改修）
//  ・3回戦までの山を左右2ブロックに分け、W杯アプリ式に中央へ収束させる
//    左＝3回戦前半の山（準々決勝Aブロック・17校）／右＝後半（Bブロック・32校）
//    ブロック分けは「勝者N」参照を3回戦から遡って自動計算（ハードコードなし）
//  ・中央カラムに準々決勝→準決勝→決勝を縦積み（抽選確定までは案内表示）
//  ・校1/校2の「勝者N」は第N試合の勝者枠。シート上は勝者N表記のまま保ち、
//    表示・連結線・ブロック計算はフロントで解決する
// ────────────────────────────────────────────────
var bkLinks = [];
var bkSide = {};

function teamInfo(name) {
  var st = APP.state;
  if (!st) return null;
  for (var i = 0; i < st.teams.length; i++) {
    if (st.teams[i].name === name) return st.teams[i];
  }
  return null;
}

function matchByNo(no) {
  var ms = APP.state.matches;
  for (var i = 0; i < ms.length; i++) {
    if (String(ms[i].no) === String(no)) return ms[i];
  }
  return null;
}

// 「勝者N」を解決する。戻り値 {name, pref, owner, tbd, from}
function resolveSlot(t) {
  var m = String(t).match(/^勝者(\d+)$/);
  if (!m) {
    var info = teamInfo(t);
    return { name: t, pref: info ? info.pref : '', owner: info ? info.owner : '' };
  }
  var from = parseInt(m[1], 10);
  var src = matchByNo(from);
  if (src && src.winner) {
    var info2 = teamInfo(src.winner);
    return { name: src.winner, pref: info2 ? info2.pref : '', owner: info2 ? info2.owner : '', from: from };
  }
  return { tbd: '第' + from + '試合の勝者', from: from };
}

function slotRowHtml(slot, score, isWinner, hasResult) {
  if (slot.tbd) {
    return '<div class="mrow tbd"><span class="obar" style="background:#2c3742"></span>'
      + '<span class="mname">' + h(slot.tbd) + '</span></div>';
  }
  var cls = 'mrow';
  if (hasResult) cls += isWinner ? ' winner' : ' loser';
  return '<div class="' + cls + '">'
    + '<span class="obar" style="background:' + ownerColor(slot.owner) + '"></span>'
    + '<span class="mname">' + h(slot.name) + '</span>'
    + '<span class="mpref">' + h(slot.pref || '') + '</span>'
    + '<span class="mscore">' + (score === null || score === undefined || score === '' ? '' : h(score)) + '</span>'
    + '</div>';
}

function matchCardHtml(m, collectLinks) {
  var s1 = resolveSlot(m.t1);
  var s2 = resolveSlot(m.t2);
  if (collectLinks) {
    if (s1.from) bkLinks.push({ from: s1.from, to: m.no });
    if (s2.from) bkLinks.push({ from: s2.from, to: m.no });
  }
  var hasResult = !!m.winner;
  var meta = '第' + h(m.no) + '試合' + (m.date ? '・' + h(m.date) : '');
  return '<div class="match" id="mk-' + h(m.no) + '">'
    + '<div class="match-meta">' + meta + '</div>'
    + slotRowHtml(s1, m.s1, hasResult && m.winner === s1.name, hasResult)
    + slotRowHtml(s2, m.s2, hasResult && m.winner === s2.name, hasResult)
    + '</div>';
}

function renderBracket() {
  var st = APP.state;
  if (!st) return;

  // 凡例
  var names = MEMBERS.concat([CARRY]);
  document.getElementById('bkLegend').innerHTML = names.map(function(n) {
    return '<span class="legend-item"><span class="legend-dot" style="background:' + ownerColor(n) + '"></span>' + h(n) + '</span>';
  }).join('');

  var hasAny = st.matches.length > 0;
  document.getElementById('bkEmpty').style.display = hasAny ? 'none' : 'block';
  document.getElementById('bkScroll').style.display = hasAny ? 'block' : 'none';
  if (!hasAny) return;

  bkLinks = [];
  bkSide = {};

  // ブロック分け：3回戦の前半の山とその祖先＝左（L）、後半＝右（R）
  var byNo = {};
  st.matches.forEach(function(m) { byNo[String(m.no)] = m; });
  function markSide(m, s) {
    bkSide[String(m.no)] = s;
    [m.t1, m.t2].forEach(function(t) {
      var mm = String(t).match(/^勝者(\d+)$/);
      if (mm && byNo[mm[1]]) markSide(byNo[mm[1]], s);
    });
  }
  var r3 = st.matches.filter(function(m) { return m.round === '3回戦'; });
  var half = Math.ceil(r3.length / 2);
  r3.forEach(function(m, i) { markSide(m, i < half ? 'L' : 'R'); });
  // 3回戦が無いデータでも壊れないように：未分類の山は全部左へ
  st.matches.forEach(function(m) {
    if (['1回戦', '2回戦', '3回戦'].indexOf(m.round) >= 0 && !bkSide[String(m.no)]) bkSide[String(m.no)] = 'L';
  });

  var treeRounds = ['1回戦', '2回戦', '3回戦'];
  function sideCols(s, reversed) {
    var order = reversed ? treeRounds.slice().reverse() : treeRounds;
    return order.map(function(round) {
      var ms = st.matches.filter(function(m) { return m.round === round && bkSide[String(m.no)] === s; });
      if (!ms.length) return '';
      return '<div class="bk-col">'
        + '<div class="bk-col-title">' + h(round) + '</div>'
        + '<div class="bk-col-body">'
        + ms.map(function(m) { return matchCardHtml(m, true); }).join('')
        + '</div></div>';
    }).join('');
  }

  // 中央カラム：準々決勝以降（再抽選で確定したらSetup.gs追記→ここに出る）
  var finalsDefs = [
    { round: '準々決勝', wait: '3回戦終了後の抽選で確定（8/16夜）' },
    { round: '準決勝',   wait: '準々決勝終了後の抽選で確定（8/18）' },
    { round: '決勝',     wait: '8/22 10:00' }
  ];
  var center = '<div class="bk-center">'
    + finalsDefs.map(function(f) {
        var ms = st.matches.filter(function(m) { return m.round === f.round; });
        var body = ms.length
          ? ms.map(function(m) { return matchCardHtml(m, false); }).join('')
          : '<div class="finals-wait">' + h(f.wait) + '</div>';
        return '<div class="bk-center-sec' + (f.round === '決勝' ? ' final' : '') + '">'
          + '<div class="bk-col-title">' + (f.round === '決勝' ? '🏆 ' : '') + h(f.round) + '</div>'
          + body + '</div>';
      }).join('')
    + '</div>';

  var tree = document.getElementById('bkTree');
  tree.innerHTML = '<svg id="bkSvg" class="bk-svg"></svg>'
    + sideCols('L', false) + center + sideCols('R', true);

  requestAnimationFrame(drawConnectors);
}

// カード位置を測ってSVGで連結線を引く（.bk-tree が offsetParent になる）
// 右ブロックは流れが右→左なので線の向きを反転する
function drawConnectors() {
  var svg = document.getElementById('bkSvg');
  var tree = document.getElementById('bkTree');
  if (!svg || !tree) return;
  svg.setAttribute('width', tree.scrollWidth);
  svg.setAttribute('height', tree.scrollHeight);

  var paths = '';
  bkLinks.forEach(function(l) {
    var a = document.getElementById('mk-' + l.from);
    var b = document.getElementById('mk-' + l.to);
    if (!a || !b) return;
    var x1, x2;
    if (bkSide[String(l.to)] === 'R') {
      x1 = a.offsetLeft;
      x2 = b.offsetLeft + b.offsetWidth;
    } else {
      x1 = a.offsetLeft + a.offsetWidth;
      x2 = b.offsetLeft;
    }
    var y1 = a.offsetTop + a.offsetHeight / 2;
    var y2 = b.offsetTop + b.offsetHeight / 2;
    var mx = (x1 + x2) / 2;
    paths += '<path d="M' + x1 + ' ' + y1 + ' C' + mx + ' ' + y1 + ',' + mx + ' ' + y2 + ',' + x2 + ' ' + y2
      + '" stroke="#39444f" stroke-width="2" fill="none"/>';
  });
  svg.innerHTML = paths;
}
</script>

  <script>
// ────────────────────────────────────────────────
// 持ち校一覧タブ：メンバーごとの9校＋キャリー4校、敗退グレーアウト、
// 勝ち残り校数サマリー、優勝バナー（キャリー優勝＝全員負け）
// ────────────────────────────────────────────────

function renderMine() {
  var st = APP.state;
  if (!st) return;

  // 敗退校の集合（勝者が入った試合の負け側）
  // ⚠️ 2回戦以降の枠はシート上「勝者N」表記のままなので、必ず実名へ解決してから
  //    負け側を拾う。ここを素の t1/t2 で比較すると、勝者N枠で負けた校が永久に
  //    生き残り扱いになる（2026-08-15に発覚・勝ち残り数が全員多く出ていた）
  var winnerByNo = {};
  st.matches.forEach(function(m) { if (m.winner) winnerByNo[String(m.no)] = m.winner; });
  function nameOf(v) {
    var mm = String(v).match(/^勝者(\d+)$/);
    return mm ? (winnerByNo[mm[1]] || '') : String(v);
  }

  var out = {};
  st.matches.forEach(function(m) {
    if (!m.winner) return;
    var a = nameOf(m.t1), b = nameOf(m.t2);
    var loser = (m.winner === a) ? b : (m.winner === b ? a : '');
    if (loser) out[loser] = true;
  });

  // 優勝バナー
  var champEl = document.getElementById('mineChampion');
  var final_ = st.matches.filter(function(m) { return m.round === '決勝' && m.winner; })[0];
  if (final_) {
    var info = teamInfo(final_.winner);
    var owner = info ? info.owner : '';
    if (owner === CARRY) {
      champEl.innerHTML = '<div class="champ-banner">🏳️ 優勝：' + h(final_.winner)
        + '<span class="champ-sub">キャリー校の優勝…全員負け！</span></div>';
    } else {
      champEl.innerHTML = '<div class="champ-banner">🏆 優勝：' + h(final_.winner)
        + '<span class="champ-sub">' + h(owner || '？') + 'の総取り！</span></div>';
    }
  } else {
    champEl.innerHTML = '';
  }

  // メンバーごとの持ち校
  var byOwner = {};
  st.teams.forEach(function(t) {
    if (!t.owner) return;
    (byOwner[t.owner] = byOwner[t.owner] || []).push(t);
  });

  var me = '';
  try { me = localStorage.getItem('koshien2026_me') || ''; } catch (e) {}

  var names = MEMBERS.concat([CARRY]);
  document.getElementById('mineList').innerHTML = names.map(function(name) {
    var teams = byOwner[name] || [];
    // 「あなた」＝この端末で最後にくじを引いた人。引く前（リセット後含む）は表示しない
    var isMe = (name === me) && teams.length > 0;
    var head = '<div class="mine-head">'
      + '<span class="mine-dot" style="background:' + ownerColor(name) + '"></span>'
      + '<span class="mine-name">' + h(name) + '</span>'
      + (isMe ? '<span class="mine-me-badge">あなた</span>' : '');

    var cardStyle = ' style="border-left:4px solid ' + ownerColor(name) + '"';
    if (!teams.length) {
      var note = (name === CARRY) ? '5人が引き終わると残り4校が入ります' : 'まだ引いていません';
      return '<div class="mine-card' + (isMe ? ' me' : '') + '"' + cardStyle + '>' + head + '</div>'
        + '<div class="mine-empty">' + note + '</div></div>';
    }

    teams.sort(function(a, b) {
      var d = (RARITY_ORDER[a.rarity] || 9) - (RARITY_ORDER[b.rarity] || 9);
      return d !== 0 ? d : String(a.pref).localeCompare(String(b.pref), 'ja');
    });
    var alive = teams.filter(function(t) { return !out[t.name]; }).length;
    head += '<span class="mine-alive">勝ち残り <strong>' + alive + '</strong> / ' + teams.length + '校</span></div>';

    var chips = teams.map(function(t) {
      return '<span class="schip' + (out[t.name] ? ' out' : '') + '">'
        + rarityBadge(t.rarity)
        + '<span class="schip-name">' + h(t.name) + '</span>'
        + '<span class="schip-pref">' + h(t.pref) + '</span>'
        + '</span>';
    }).join('');

    var barColor = ownerColor(name);
    var bar = '<div class="alive-bar"><div class="alive-fill" style="width:' + Math.round(alive / teams.length * 100)
      + '%;background:' + barColor + ';color:' + barColor + '"></div></div>';

    return '<div class="mine-card' + (isMe ? ' me' : '') + '"' + cardStyle + '>' + head
      + bar
      + '<div class="school-chips">' + chips + '</div></div>';
  }).join('');
}
</script>

  <script>
// ────────────────────────────────────────────────
// 起動・タブ切替・状態管理
// 起動時：前回キャッシュを即表示 → 裏で最新を取得して差し替え
// ────────────────────────────────────────────────
var APP = { state: null, hasFresh: false };

function renderAll() {
  if (!APP.state) return;
  renderDraw();
  renderBracket();
  renderMine();
}

function showTab(name) {
  ['draw', 'bracket', 'mine'].forEach(function(t) {
    document.getElementById('tab-' + t).style.display = (t === name) ? 'block' : 'none';
    document.getElementById('tabbtn-' + t).classList.toggle('active', t === name);
  });
  if (name === 'bracket') setTimeout(drawConnectors, 30);
  window.scrollTo(0, 0);
}

function refreshState(cb) {
  apiCall('state', null, function(d) {
    APP.state = d;
    APP.hasFresh = true;
    saveCache('state', d);
    renderAll();
    setDataStatus('');
    if (cb) cb(true);
  }, function() {
    var cached = loadCache('state');
    if (cached) {
      setDataStatus('オフライン（最終更新 ' + fmtCacheTime(cached.t) + '）');
    } else {
      setDataStatus('データを取得できませんでした。🔄 で再試行してください');
    }
    if (cb) cb(false);
  });
}

function onRefresh() {
  var btn = document.getElementById('refreshBtn');
  btn.classList.add('spin');
  refreshState(function() { btn.classList.remove('spin'); });
}

(function boot() {
  var cached = loadCache('state');
  if (cached) {
    APP.state = cached.d;
    renderAll();
    setDataStatus('前回データを表示中（' + fmtCacheTime(cached.t) + '）… 更新しています');
  }
  refreshState();
  window.addEventListener('resize', function() { drawConnectors(); });
})();
</script>
